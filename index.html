async function giveGift(from,to,giftObj,text,free){
  const fid=idOf(from);
  if(!fid||!to||!giftObj)throw new Error("Ошибка получателя. Перезагрузите страницу.");
  const b=writeBatch(db);
  if(!free) b.update(doc(db,"users",fid),{coins:increment(-giftObj.price)});
  
  const edition = giftObj.total ? `${Math.floor(Math.random() * giftObj.total) + 1}/${giftObj.total}` : null;
  
  b.update(doc(db,"users",to),{gifts:arrayUnion({
    giftId: giftObj.id,
    name: giftObj.name,
    rarity: giftObj.rarity,
    svg: giftObj.svg,
    edition: edition,
    by: fid,
    byName: from.name,
    text: text||"",
    ts: Date.now()
  })});
  
  b.set(doc(collection(db,"messages")),{
    from:fid, to, participants:[fid,to], type:"gift", 
    giftId: giftObj.id, giftName: giftObj.name, giftRarity: giftObj.rarity, giftSvg: giftObj.svg, giftEdition: edition,
    text:text||"", ts:Date.now(), read:false
  });
  b.set(doc(db,"stats","global"),{gifts:increment(1),messages:increment(1)},{merge:true});
  await b.commit();
}

    <div className="pn tx rounded-2xl w-full max-w-sm max-h-[90vh] overflow-y-auto shadow-2xl border border-[var(--line)]" onClick={e=>e.stopPropagation()}>{children}</div>
  </div>);

const Setup=()=>(
  <div className="min-h-screen grid place-items-center p-6 bg-slate-100"><div className="bg-white rounded-2xl shadow p-8 max-w-md">
    <h1 className="text-xl font-bold mb-2">Почти готово</h1>
    <p className="text-slate-600">Откройте этот файл, найдите <code className="bg-slate-100 px-1 rounded">firebaseConfig</code> в начале скрипта, вставьте свои ключи Firebase, сохраните и перезагрузите.</p></div></div>);

function Login(){
  const [ph,setPh]=useState(""),[code,setCode]=useState(""),[conf,setConf]=useState(null),[err,setErr]=useState(""),[busy,setBusy]=useState(false);
  const clean=ph.replace(/[\s()-]/g,"");
  const send=async()=>{
    setErr(""); if(!/^\+\d{8,15}$/.test(clean))return setErr("Используйте международный формат, например +79991234567");
    setBusy(true);
    try{ try{window.rv?.clear()}catch{} window.rv=new RecaptchaVerifier(auth,"rc",{size:"invisible"}); setConf(await signInWithPhoneNumber(auth,clean,window.rv)); }
    catch(e){ setErr(e.code==="auth/unauthorized-domain"?"Добавьте домен этого сайта в Firebase -> Authentication -> Settings -> Authorized domains":e.message); try{window.rv?.clear()}catch{} }
    setBusy(false);
  };
  const verify=async e=>{ e.preventDefault(); setBusy(true); setErr(""); try{await conf.confirm(code.trim())}catch{setErr("Неверный или истекший код. Попробуйте снова.")} setBusy(false); };
  return(
    <div className="min-h-screen grid place-items-center p-4">
      <div className="pn rounded-3xl shadow-lg w-full max-w-sm overflow-hidden border border-[var(--line)]">
        <div className="acb p-6 text-center"><Send className="mx-auto mb-2" size={36}/><h1 className="text-2xl font-bold">BunkMess</h1><p className="text-white/80 text-sm">Вход по номеру телефона</p></div>
        <div className="p-6 space-y-3">
          {!conf?<>
            <input className="inp" type="tel" placeholder="+7 999 123-45-67" value={ph} onChange={e=>setPh(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()}/>
            <button disabled={busy} onClick={send} className={B+" w-full"}>{busy?"Отправка…":"Отправить код"}</button>
            <button onClick={()=>setPh(ADMIN_PHONE)} className="w-full text-sm act">Быстрый вход (Админ)</button>
          </>:<form onSubmit={verify} className="space-y-3">
            <p className="text-sm mu">Введите 6-значный код, отправленный на {clean}</p>
            <input className="inp text-center tracking-widest text-lg" inputMode="numeric" maxLength={6} placeholder="••••••" value={code} onChange={e=>setCode(e.target.value)} autoFocus/>
            <button disabled={busy||code.length<6} className={B+" w-full"}>{busy?"Проверка…":"Подтвердить"}</button>
            <button type="button" onClick={()=>{setConf(null);setCode("")}} className="w-full text-sm mu">Использовать другой номер</button>
          </form>}
          {err&&<p className="text-sm text-red-500">{err}</p>}
          <div id="rc"/>
        </div>
      </div>
    </div>);
}

function Onboard({au,users,logout}){
  const isAdm=au.phoneNumber===ADMIN_PHONE;
  const [f,setF]=useState({u:isAdm?ADMIN_USERNAME:"",name:"",bio:"",emoji:AVATARS[0],color:COLORS[5]});
  const [err,setErr]=useState(""),[busy,setBusy]=useState(false);
  const set=p=>setF(o=>({...o,...p}));
  const go=async()=>{
    const u=f.u.trim().toLowerCase().replace(/^@/,"");
    if(!/^[a-z0-9_а-яё]{3,20}$/.test(u))return setErr("Имя пользователя: 3-20 букв, цифр или _");
    if(!f.name.trim())return setErr("Введите отображаемое имя");
    if(u===ADMIN_USERNAME&&!isAdm)return setErr("Это имя зарезервировано");
    if(users.some(x=>x.username===u))return setErr("@"+u+" уже занято");
    setBusy(true);
    try{await setDoc(doc(db,"users",au.uid),{uid:au.uid,username:u,name:f.name.trim(),bio:f.bio.trim(),emoji:f.emoji,color:f.color,verified:isAdm,banned:false,coins:START_COINS,gifts:[],lastBonus:0,lastSeen:Date.now(),createdAt:Date.now()})}
    catch(e){setErr(e.message);setBusy(false)}
  };
  return(
    <div className="min-h-screen grid place-items-center p-4"><div className="pn rounded-3xl shadow-lg w-full max-w-sm p-6 space-y-3 border border-[var(--line)]">
      <h1 className="text-xl font-bold">Настройка профиля</h1>
      <input className="inp" placeholder="@имя_пользователя" value={f.u} disabled={isAdm} onChange={e=>set({u:e.target.value})} autoCapitalize="none"/>
      <input className="inp" placeholder="Отображаемое имя" value={f.name} onChange={e=>set({name:e.target.value})} maxLength={30}/>
      <textarea className="inp resize-none" rows={2} placeholder="О себе (необязательно)" value={f.bio} onChange={e=>set({bio:e.target.value})} maxLength={140}/>
      <Picker f={f} set={set}/>
      {err&&<p className="text-sm text-red-500">{err}</p>}
      <button disabled={busy} onClick={go} className={B+" w-full"}>Создать профиль</button>
      <button onClick={logout} className="w-full text-sm mu">Отмена и выход</button>
    </div></div>);
}

function Profile({u,me,now,onClose,onChat,onGift}){
  const gifts = u.gifts || [];
  const grouped = gifts.reduce((acc, g) => {
    if (!acc[g.giftId]) acc[g.giftId] = { ...g, count: 0 };
    acc[g.giftId].count++;
    return acc;
  }, {});
  const sortedGifts = Object.values(grouped).sort((a, b) => {
    const rarities = { mythic: 5, legendary: 4, epic: 3, rare: 2, common: 1 };
    return (rarities[b.rarity] || 0) - (rarities[a.rarity] || 0);
  });

  const row=(l,v)=><div className="flex justify-between gap-3 py-2 border-b bl text-sm"><span className="mu">{l}</span><span className="text-right">{v}</span></div>;
  return(
    <Modal onClose={onClose}>
      <div className="p-6 text-center relative">
        <div className="mx-auto w-24 h-24 rounded-md grid place-items-center text-5xl shadow-lg" style={{background:u.color}}>{u.emoji}</div>
        <div className="text-xl mt-3"><Name u={u}/></div>
        <div className={`text-sm ${online(u,now)?"act":"mu"}`}>{online(u,now)?"в сети":"был(а) "+seen(u.lastSeen||u.createdAt)}</div>
      </div>
      <div className="px-6">
        {row("Имя пользователя","@"+u.username)}
        {row("О себе",u.bio||"Не указано")}
        <div className="py-3">
          <div className="font-semibold text-sm mb-3 flex items-center gap-2"><Gift size={16}/> Коллекция подарков ({gifts.length})</div>
          {sortedGifts.length===0?<p className="text-sm mu text-center py-4">Пока нет подарков</p>:
            <div className="grid grid-cols-3 gap-3">
              {sortedGifts.map((g, idx) => (
                <div key={idx} className="pn rounded-xl p-2 text-center border border-[var(--line)] hover:border-[var(--acc)] transition-colors">
                  <div dangerouslySetInnerHTML={{__html: g.svg.replace('svg-gift', 'svg-gift anim-float')}} />
                  <div className="text-xs font-semibold mt-1 truncate">{g.name}</div>
                  {g.rarity && <div className={`text-[10px] uppercase font-bold rarity-${g.rarity}`}>{g.rarity}</div>}
                  {g.count > 1 && <div className="text-xs mu mt-1">x{g.count}</div>}
                </div>
              ))}
            </div>
          }
        </div>
      </div>
      <div className="p-6 pt-2 flex gap-2">
        <button onClick={()=>onChat(idOf(u))} className={B+" flex-1"}>Написать</button>
        {u.uid!==me.uid&&<button onClick={()=>onGift(idOf(u))} className="sel rounded-xl px-4 py-2 font-semibold flex-1 flex items-center justify-center gap-1.5 border border-[var(--line)]"><Gift size={16}/>Подарить</button>}
      </div>
    </Modal>);
}

function GiftPicker({to,me,free,onClose,onSent}){
  const [tab,setTab]=useState("regular");
  const [selectedId, setSelectedId] = useState(GIFTS[0].id);
  const [msg,setMsg]=useState(""),[busy,setBusy]=useState(false),[err,setErr]=useState("");
  
  const filteredGifts = GIFTS.filter(g => g.tab === tab);
  const gift = GIFTS.find(g => g.id === selectedId) || GIFTS[0];
  const can=free||(me.coins||0)>=gift.price;
  
  const go=async()=>{ 
    setBusy(true); 
    try{
      await giveGift(me,idOf(to),gift,msg.trim(),free);
      onSent&&onSent(gift);
      onClose();
    } catch(e){
      setErr(e.message);
      setBusy(false);
    } 
  };

  const tabs = [
    { id: "regular", label: "Обычные", icon: Gift },
    { id: "nft", label: "NFT", icon: Sparkles },
    { id: "limited", label: "Лимитка", icon: Lock }
  ];

  return(
    <Modal onClose={onClose}>
      <div className="p-5 space-y-4">
        <div className="flex justify-between items-center">
          <h3 className="font-bold text-lg">Подарок для {to.name}</h3>
          <span className="text-sm mu flex items-center gap-1 pn px-2 py-1 rounded-lg"><Coins size={15}/>{me.coins||0}</span>
        </div>
        
        <div className="flex gap-1 p-1 bg-[var(--input)] rounded-xl">
          {tabs.map(t => (
            <button key={t.id} onClick={()=>{setTab(t.id); setSelectedId(GIFTS.find(g=>g.tab===t.id).id)}} 
              className={`flex-1 flex items-center justify-center gap-1.5 py-2 rounded-lg text-sm font-medium transition-all ${tab===t.id?"acb shadow-sm":"mu hover:text-[var(--text)]"}`}>
              <t.icon size={14}/> {t.label}
            </button>
          ))}
        </div>

        <div className="grid grid-cols-3 gap-2 max-h-60 overflow-y-auto pr-1">
          {filteredGifts.map((g)=>{
            const isSoldOut = g.stock === 0;
            return (
              <button key={g.id} onClick={()=>!isSoldOut&&setSelectedId(g.id)} 
                className={`sel rounded-xl p-2 text-center transition-all relative ${selectedId===g.id?"ring-2 ring-[var(--acc)] bg-[var(--hover)]":""} ${isSoldOut?"opacity-50 cursor-not-allowed":""}`}>
                {g.rarity === 'mythic' || g.rarity === 'legendary' ? <div className="absolute top-1 left-1 text-[8px] font-bold text-amber-400">NFT</div> : null}
                {g.tab === 'limited' ? <div className="absolute top-1 left-1 text-[8px] font-bold text-pink-400">LTD</div> : null}
                <div dangerouslySetInnerHTML={{__html: g.svg.replace('svg-gift', 'svg-gift')}} className="mb-1" />
                <div className="text-[11px] font-semibold truncate">{g.name}</div>
                <div className="text-[10px] mu">{free?"Бесплатно":g.price+" ⭐"}</div>
                {g.total && <div className={`text-[9px] mt-1 ${isSoldOut?"text-red-500 font-bold":"text-green-500"}`}>{isSoldOut?"Распродано":`Ост: ${g.stock}`}</div>}
              </button>
            );
          })}
        </div>

        <input className="inp" placeholder="Добавить сообщение (необязательно)" maxLength={100} value={msg} onChange={e=>setMsg(e.target.value)}/>
        {err&&<p className="text-sm text-red-500">{err}</p>}
        
        <div className="flex justify-between items-center text-xs mu px-1">
          <span className={`rarity-${gift.rarity} font-bold uppercase`}>{gift.rarity || 'Обычный'}</span>
          <span>Баланс после: {(me.coins||0)-(free?0:gift.price)} ⭐</span>
        </div>
        
        <button disabled={busy||!can} onClick={go} className={B+" w-full flex items-center justify-center gap-2"}>
          {can ? `Отправить "${gift.name}"` : "Недостаточно монет"}
        </button>
      </div>
    </Modal>);
}

function GiftAnim({giftData,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,2500);return()=>clearTimeout(t)},[]);
  return(
    <div className="fixed inset-0 z-[60] pointer-events-none grid place-items-center" style={{background:"rgba(0,0,0,.8)",backdropFilter:"blur(4px)",animation:"gfade 2.5s forwards"}}>
      <div className="text-center transform scale-150">
        <div style={{animation:"gpop 2.2s ease-out forwards"}} dangerouslySetInnerHTML={{__html: giftData.svg.replace('svg-gift', 'svg-gift-lg ' + (giftData.anim || 'anim-float'))}} />
        <div className="mt-6 text-sm uppercase font-bold tracking-[0.2em] text-white" style={{animation:"gtext 2.2s forwards"}}>{giftData.name}</div>
        {giftData.edition && <div className="mt-2 text-xs text-amber-400 font-mono" style={{animation:"gtext 2.2s forwards"}}>Edition #{giftData.edition}</div>}
      </div>
    </div>);
}

function Prefs({me,logout,prefs,save}){
  const [f,setF]=useState({name:me.name,bio:me.bio||"",emoji:me.emoji,color:me.color}),[ok,setOk]=useState(false);
  const set=p=>{setOk(false);setF(o=>({...o,...p}))};
  const left=864e5-(Date.now()-(me.lastBonus||0)),ready=left<=0;
  const sv=async()=>{if(!f.name.trim())return;await updateDoc(doc(db,"users",me.uid),{name:f.name.trim(),bio:f.bio.trim(),emoji:f.emoji,color:f.color});setOk(true)};
  const claim=()=>updateDoc(doc(db,"users",me.uid),{coins:increment(BONUS),lastBonus:Date.now()});
  const chip=on=>`rounded-xl px-3 py-1.5 text-sm ${on?"acb":"sel"}`;
  const card="pn rounded-2xl shadow-sm p-5 max-w-md space-y-3 border border-[var(--line)]";
  return(
    <div className="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 tx">
      <div className={card}><h2 className="text-xl font-bold">Профиль</h2>
        <div className="flex items-center gap-3"><Avatar u={{...me,...f}} size={56}/><div><div className="font-semibold">{f.name}</div><div className="text-sm mu">@{me.username}</div></div></div>
        <input className="inp" value={f.name} onChange={e=>set({name:e.target.value})} maxLength={30} placeholder="Отображаемое имя"/>
        <textarea className="inp resize-none" rows={2} value={f.bio} onChange={e=>set({bio:e.target.value})} maxLength={140} placeholder="О себе"/>
        <Picker f={f} set={set}/>
        <div className="flex items-center gap-3"><button onClick={sv} className={B}>Сохранить</button>{ok&&<span className="text-sm text-green-500">Сохранено</span>}</div></div>
      <div className={card}><h2 className="text-xl font-bold">Кошелек</h2>
        <div className="flex items-center justify-between"><span className="flex items-center gap-2 text-2xl font-bold"><Coins className="act"/>{me.coins}</span>
          <button disabled={!ready} onClick={claim} className={B}>{ready?`Получить ${BONUS} ⭐`:`Следующий бонус через ${Math.ceil(left/36e5)}ч`}</button></div></div>
      <div className={card}><h2 className="text-xl font-bold">Внешний вид</h2>
        <div className="flex flex-wrap gap-2">{Object.keys(THEMES).map(k=><button key={k} onClick={()=>save({...prefs,theme:k})} className={chip(prefs.theme===k)}>{TNAMES[k]}</button>)}</div>
        <div className="flex gap-2">{Object.entries(ACC).map(([k,c])=><button key={k} title={k} onClick={()=>save({...prefs,acc:k})} style={{background:c}} className={`w-8 h-8 rounded-full ${prefs.acc===k?"ring-2 ring-offset-2 ring-slate-500":""}`}/>)}</div>
        <div className="flex flex-wrap gap-2">{Object.keys(WALLS).map(k=><button key={k} onClick={()=>save({...prefs,wall:k})} className={chip(prefs.wall===k)+" capitalize"}>{k==="none"?"Без обоев":k}</button>)}</div></div>
      <button onClick={logout} className="flex items-center gap-1.5 text-red-500 rounded-xl px-4 py-2 hv w-full"><LogOut size={16}/>Выйти из аккаунта</button>
    </div>);
}

function Admin({me,users,stats,ann,now}){
  const [t,setT]=useState("users"),[q,setQ]=useState(""),[a,setA]=useState(""),[all,setAll]=useState([]),[fq,setFq]=useState("");
  const [to,setTo]=useState(""),[gi,setGi]=useState(0),[amt,setAmt]=useState(100),[note,setNote]=useState("");
  useEffect(()=>onSnapshot(collection(db,"messages"),s=>setAll(s.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>y.ts-x.ts))),[]);
  const nm=id=>users.find(x=>x.uid===id)?.name||"deleted";
  const upd=(u,p)=>updateDoc(doc(db,"users",idOf(u)),p);
  const batch=async(arr,fn)=>{const b=writeBatch(db);arr.slice(0,450).forEach(x=>fn(b,x));await b.commit()};
  const del=async u=>{
    if(!confirm(`Удалить @${u.username} и все их сообщения?`))return;
    const b=writeBatch(db);all.filter(m=>m.from===idOf(u)||m.to===idOf(u)).slice(0,450).forEach(m=>b.delete(doc(db,"messages",m.id)));
    b.delete(doc(db,"users",idOf(u)));await b.commit();
  };
  const coins=u=>{const v=Number(prompt(`Монеты для ${u.name}: добавить (100) или снять (-100)`,"100"));if(v)upd(u,{coins:increment(Math.round(v))})};
  const fm=all.filter(m=>(nm(m.from)+" "+nm(m.to)+" "+(m.text||"")).toLowerCase().includes(fq.toLowerCase()));
  const target=users.find(x=>idOf(x)===to)||users.find(x=>idOf(x)!==idOf(me));
  const tabs={users:"Пользователи",mod:"Модерация",eco:"Подарки и Экономика",stats:"Статистика"};
  const card="pn rounded-2xl p-4 shadow-sm space-y-2 border border-[var(--line)]";

      <div className="flex flex-wrap gap-2">{Object.entries(tabs).map(([k,l])=><button key={k} onClick={()=>setT(k)} className={`rounded-xl px-3 py-1.5 text-sm font-semibold ${t===k?"acb":"pn border border-[var(--line)]"}`}>{l}</button>)}</div>

      {t==="users"&&<div className="space-y-3">
        <input className="inp pn border border-[var(--line)]" placeholder="Поиск пользователей" value={q} onChange={e=>setQ(e.target.value)}/>
        <div className="pn rounded-2xl shadow-sm divide-y bl border border-[var(--line)]">{users.filter(u=>(u.name+u.username).toLowerCase().includes(q.toLowerCase())).map(u=>(
          <div key={u.uid} className="flex items-center gap-3 p-3 flex-wrap">
            <Avatar u={u} size={40}/>

            <button onClick={()=>coins(u)} className="sel rounded-lg px-2 h-9 text-sm flex items-center gap-1"><Coins size={15}/>{u.coins||0}</button>
            {u.username!==ADMIN_USERNAME&&<div className="flex gap-1.5">
              <button title="Верификация" onClick={()=>upd(u,{verified:!u.verified})} className={btn(u.verified,"bg-blue-500/20 text-[#2787f5]")}><BadgeCheck size={18}/></button>

          <button onClick={async()=>{if(!a.trim())return;await addDoc(collection(db,"announcements"),{text:a.trim(),ts:Date.now()});setA("")}} className={B}>Опубликовать</button>

              <div dangerouslySetInnerHTML={{__html: x.svg.replace('svg-gift', 'svg-gift')}} className="w-8 h-8 mx-auto" />
              <div className="text-[10px] mt-1">{x.name}</div>
            </button>)}
          </div>
          <button disabled={!target} onClick={async()=>{await giveGift(me,idOf(target),GIFTS[gi],"Подарок от администратора",true);setNote("Подарок отправлен")}} className={B}>Отправить {GIFTS[gi].name} бесплатно</button></div>
        <div className={card}><div className="font-semibold">Монеты для всех</div>
          <input className="inp" type="number" value={amt} onChange={e=>setAmt(Number(e.target.value))}/>
          <div className="flex flex-wrap gap-2">
            <button onClick={async()=>{await batch(users,(b,u)=>b.update(doc(db,"users",idOf(u)),{coins:increment(amt)}));setNote("Монеты начислены")}} className={B}>Дать {amt} всем</button>
            <button onClick={async()=>{if(confirm(`Сбросить баланс всех до ${START_COINS}?`)){await batch(users,(b,u)=>b.update(doc(db,"users",idOf(u)),{coins:START_COINS}));setNote("Баланс сброшен")}}} className="sel rounded-xl px-4 py-2 font-semibold">Сбросить до {START_COINS}</button></div></div>
        {note&&<p className="text-sm text-green-500">{note}</p>}</div>}

      {t==="stats"&&<div className="grid grid-cols-2 gap-3">
        <div className="pn rounded-2xl p-4 shadow-sm border border-[var(--line)]"><div className="text-3xl font-bold act">{users.length}</div><div className="text-sm mu">Всего пользователей</div></div>
        <div className="pn rounded-2xl p-4 shadow-sm border border-[var(--line)]"><div className="text-3xl font-bold act">{users.filter(u=>online(u,now)).length}</div><div className="text-sm mu">В сети сейчас</div></div>
        <div className="pn rounded-2xl p-4 shadow-sm border border-[var(--line)]"><div className="text-3xl font-bold act">{stats.messages||0}</div><div className="text-sm mu">Всего сообщений</div></div>
        <div className="pn rounded-2xl p-4 shadow-sm border border-[var(--line)]"><div className="text-3xl font-bold act">{stats.gifts||0}</div><div className="text-sm mu">Всего подарков</div></div>
      </div>}
    </div>);
}

function Messenger({me,users,logout,prefs,save}){
  const admin=me.username===ADMIN_USERNAME;
  const [tab,setTab]=useState("chats"),[peer,setPeer]=useState(null),[q,setQ]=useState(""),[text,setText]=useState(""),[emo,setEmo]=useState(false);
  const [prof,setProf]=useState(null),[giftTo,setGiftTo]=useState(null),[anim,setAnim]=useState(null),[dl,setDl]=useState(0);
  const seenIds=useRef(null),pc=useRef(me.coins||0);
  const [msgs,setMsgs]=useState([]),[ann,setAnn]=useState([]),[stats,setStats]=useState({}),[now,setNow]=useState(Date.now());
  const end=useRef(null);
  const withId=s=>s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.ts-b.ts);

  useEffect(()=>{
    const u1=onSnapshot(query(collection(db,"messages"),where("participants","array-contains",me.uid)),s=>{
      const arr=withId(s);
      if(!seenIds.current)seenIds.current=new Set(arr.map(m=>m.id));
      else{
        const fresh=arr.filter(m=>!seenIds.current.has(m.id));
        fresh.forEach(m=>seenIds.current.add(m.id));
        const gm=fresh.filter(m=>m.type==="gift"&&m.to===me.uid&&Date.now()-m.ts<20000).pop();
        if(gm) {
          const giftData = GIFTS.find(g=>g.id===m.giftId) || {name: m.giftName, svg: m.giftSvg, rarity: m.giftRarity, edition: m.giftEdition, anim: "anim-float"};
          setAnim(giftData);
        }
      }
      setMsgs(arr)});
    const u2=onSnapshot(collection(db,"announcements"),s=>setAnn(withId(s)));
    const u3=onSnapshot(doc(db,"stats","global"),s=>setStats(s.data()||{}));
    const beat=()=>{updateDoc(doc(db,"users",me.uid),{lastSeen:Date.now()}).catch(()=>{});setNow(Date.now())};
    beat(); const i=setInterval(beat,30000);
    return()=>{u1();u2();u3();clearInterval(i)};
  },[me.uid]);

  useEffect(()=>{const c=me.coins||0;if(c!==pc.current){setDl(c-pc.current);pc.current=c;const t=setTimeout(()=>setDl(0),1800);return()=>clearTimeout(t)}},[me.coins]);
  const byId=id=>id?users.find(u=>idOf(u)===id):undefined;
  const peerU=byId(peer);
  const profU=byId(prof),giftU=byId(giftTo);
  const thread=useMemo(()=>msgs.filter(m=>m.from===peer||m.to===peer),[msgs,peer]);
  const convos=useMemo(()=>{
    const m={};
    msgs.forEach(x=>{const p=x.from===me.uid?x.to:x.from;m[p]=m[p]||{unread:0};m[p].last=x;if(x.to===me.uid&&!x.read)m[p].unread++;});
    return m;
  },[msgs]);
  const unreadAll=Object.values(convos).reduce((a,c)=>a+c.unread,0);

  useEffect(()=>{
    if(!peer)return;
    const un=msgs.filter(m=>m.from===peer&&m.to===me.uid&&!m.read);if(!un.length)return;
    const b=writeBatch(db);un.forEach(m=>b.update(doc(db,"messages",m.id),{read:true}));b.commit().catch(()=>{});
  },[msgs,peer]);
  useEffect(()=>{end.current?.scrollIntoView({behavior:"smooth"})},[thread.length,peer]);

  const openChat=id=>{if(!id)return;setPeer(id);setProf(null);setTab("chats")};
  const send=async()=>{
    const t=text.trim(),to=idOf(peerU);if(!t||!to||me.banned)return;setText("");setEmo(false);
    try{
      await addDoc(collection(db,"messages"),{from:idOf(me),to,participants:[idOf(me),to],type:"text",text:t,ts:Date.now(),read:false});
      setDoc(doc(db,"stats","global"),{messages:increment(1)},{merge:true});
    }catch(e){alert("Не удалось отправить: "+e.message)}
  };

  const list=users.filter(u=>u.uid!==me.uid)
    .filter(u=>tab==="users"||convos[u.uid])
    .filter(u=>(u.name+u.username).toLowerCase().includes(q.toLowerCase()))
    .sort((a,b)=>tab==="users"?a.name.localeCompare(b.name):convos[b.uid].last.ts-convos[a.uid].last.ts);
  const view=tab==="settings"||(tab==="admin"&&admin)?tab:"chat";
  const showMain=view!=="chat"||!!peerU;
  const pin=ann[ann.length-1];
  const nav=(id,Icon,label,badge)=>(
    <button title={label} onClick={()=>setTab(id)} className={`relative w-11 h-11 rounded-xl grid place-items-center transition ${tab===id?"acb":"text-slate-400 hover:bg-white/10 hover:text-white"}`}>
      <Icon size={22}/>{badge>0&&<span className="absolute -top-1 -right-1 min-w-4 h-4 px-1 rounded-full bg-red-500 text-white text-[10px] grid place-items-center">{badge}</span>}
    </button>);

  return(
    <div className="flex bgm tx overflow-hidden" style={{height:"100dvh"}}>
      <nav className="w-14 md:w-16 flex flex-col items-center py-3 gap-2 shrink-0 border-r border-[var(--line)]" style={{background:"var(--rail)"}}>
        <button className="mb-2" title="Мой профиль" onClick={()=>setProf(me.uid)}><Avatar u={me} size={38}/></button>
        {nav("chats",MessageCircle,"Чаты",unreadAll)}
        {nav("users",Users,"Все пользователи")}
        {nav("settings",Settings,"Настройки")}
        {admin&&nav("admin",Shield,"Админ-панель")}
      </nav>

      <aside className={`${showMain?"hidden md:flex":"flex"} w-full md:w-80 pn border-r bl flex-col shrink-0`}>
        <div className="p-3 space-y-2">
          <div className="flex items-center justify-between px-1"><h2 className="text-lg font-bold">{tab==="users"?"Пользователи":"Чаты"}</h2><span className="relative text-sm mu flex items-center gap-1 pn px-2 py-1 rounded-lg"><Coins size={14}/>{me.coins||0}{dl!==0&&<span className={`gdelta ${dl<0?"text-red-500":"text-green-500"}`}>{dl>0?"+":""}{dl}</span>}</span></div>
          <div className="relative"><Search size={16} className="absolute left-3 top-3 mu"/>
            <input className="inp pl-9" placeholder="Поиск" value={q} onChange={e=>setQ(e.target.value)}/></div>
        </div>
        <div className="flex-1 overflow-y-auto">
          {list.length===0&&<p className="text-center text-sm mu p-6">{tab==="users"?"Пользователи не найдены.":"Нет чатов. Откройте 'Все пользователи', чтобы начать."}</p>}
          {list.map(u=>{const c=convos[u.uid];return(
            <div key={u.uid} onClick={()=>tab==="users"?setProf(idOf(u)):openChat(idOf(u))} className={`w-full flex items-center gap-3 px-3 py-2.5 cursor-pointer hv ${peer===u.uid?"sel":""}`}>
              <span onClick={e=>{e.stopPropagation();setProf(idOf(u))}}><Avatar u={u} dot={online(u,now)}/></span>
              <div className="min-w-0 flex-1">
                <div className="flex justify-between gap-2"><Name u={u}/>{c&&<span className="text-xs mu shrink-0">{time(c.last.ts)}</span>}</div>
                <div className="flex justify-between gap-2">
                  <span className="text-sm mu truncate">{c?(c.last.from===me.uid?"Вы: ":"")+prev(c.last):"@"+u.username}</span>
                  {c&&c.unread>0&&<span className="min-w-5 h-5 px-1.5 rounded-full acb text-xs grid place-items-center shrink-0">{c.unread}</span>}
                </div>
              </div>
            </div>)})}
        </div>
      </aside>

      <main className={`${showMain?"flex":"hidden md:flex"} flex-1 flex-col min-w-0`}>
        {pin&&<div className="pn tx border-b bl px-4 py-2 flex items-center gap-2 text-sm" style={{borderLeft:"3px solid var(--acc)"}}>
          <Megaphone size={16} className="shrink-0"/><span className="min-w-0 flex-1"><b>Объявление:</b> {pin.text}</span>
          {admin&&<button title="Удалить объявление" onClick={()=>deleteDoc(doc(db,"announcements",pin.id))}><X size={16}/></button>}</div>}

        {view==="admin"?<Admin me={me} users={users} stats={stats} ann={ann} now={now}/>:view==="settings"?<Prefs me={me} logout={logout} prefs={prefs} save={save}/>:!peerU?(
          <div className="flex-1 grid place-items-center mu" style={{background:"var(--chat)"}}><span className="pn rounded-full px-4 py-1.5 text-sm border border-[var(--line)]">Выберите чат, чтобы начать общение</span></div>
        ):(<>
          <header className="pn border-b bl px-3 py-2.5 flex items-center gap-3">
            <button className="md:hidden mu" onClick={()=>setPeer(null)}><ArrowLeft/></button>
            <button className="flex items-center gap-3 min-w-0 text-left" onClick={()=>setProf(idOf(peerU))}>
              <Avatar u={peerU} size={40}/>
              <div className="min-w-0"><Name u={peerU}/><div className={`text-xs ${online(peerU,now)?"act":"mu"}`}>{online(peerU,now)?"в сети":"был(а) "+seen(peerU.lastSeen||peerU.createdAt)}</div></div></button>
            <button title="Отправить подарок" onClick={()=>setGiftTo(idOf(peerU))} className="ml-auto act p-1.5 hover:bg-[var(--hover)] rounded-lg transition-colors"><Gift size={22}/></button>
          </header>
          <div className="flex-1 overflow-y-auto p-3 md:p-5 space-y-1.5" style={{backgroundColor:"var(--chat)",backgroundImage:WALLS[prefs.wall],backgroundSize:WSIZE[prefs.wall]||"auto"}}>
            {thread.length===0&&<p className="text-center text-sm mu mt-6">Сообщений пока нет. Напишите привет!</p>}
            {thread.map(m=>{
              const mine=m.from===me.uid;
              if (m.type === "gift") {
                const g = GIFTS.find(x => x.id === m.giftId) || { name: m.giftName, svg: m.giftSvg, rarity: m.giftRarity, edition: m.giftEdition, anim: "anim-float" };
                return (
                  <div key={m.id} className="flex justify-center py-2">
                    <div className="pn tx rounded-2xl p-4 text-center max-w-[85%] border-2 relative overflow-hidden" style={{borderColor: m.giftRarity === 'mythic' ? '#f97316' : m.giftRarity === 'legendary' ? '#f59e0b' : 'var(--acc)', background: m.giftRarity === 'mythic' ? 'linear-gradient(135deg, rgba(239,68,68,0.1), rgba(251,191,36,0.1))' : 'var(--panel)'}}>
                      {m.giftRarity === 'mythic' || m.giftRarity === 'legendary' ? <div className="absolute top-2 right-2 text-[10px] font-bold text-amber-400">NFT</div> : null}
                      <div dangerouslySetInnerHTML={{__html: g.svg.replace('svg-gift', 'svg-gift-lg ' + (g.anim || 'anim-float'))}} />
                      <div className="font-bold text-lg mt-2">{mine?"Вы отправили":(users.find(u=>u.uid===m.from)?.name||"Кто-то")+" отправил вам"}</div>
                      <div className={`text-sm font-bold uppercase rarity-${m.giftRarity}`}>{m.giftRarity || 'Обычный'}</div>
                      <div className="text-base font-semibold">{g.name}</div>
                      {m.giftEdition && <div className="text-xs font-mono mu mt-1">Edition #{m.giftEdition}</div>}
                      {m.text&&<div className="text-sm italic mt-2 pn p-2 rounded-lg inline-block">"{m.text}"</div>}
                      <div className="text-[11px] opacity-60 mt-2">{time(m.ts)}</div>
                    </div>
                  </div>
                );
              }
              return (
                <div key={m.id} className={`flex ${mine?"justify-end":"justify-start"}`}>
                  <div className={`max-w-[80%] px-3 py-1.5 rounded-2xl shadow-sm ${mine?"acb rounded-br-md":"tx rounded-bl-md border border-[var(--line)]"}`} style={mine?null:{background:"var(--in)"}}>
                    <span className="whitespace-pre-wrap break-words">{m.text}</span>
                    <span className={`ml-2 float-right mt-1.5 text-[11px] inline-flex items-center gap-0.5 ${mine?"text-white/80":"mu"}`}>{time(m.ts)}{mine&&(m.read?<CheckCheck size={14}/>:<Check size={14}/>)}</span>
                  </div>
                </div>
              );
            })}
            <div ref={end}/>
          </div>
          {me.banned?<div className="bg-red-500/15 text-red-500 text-center text-sm py-3">Вы заблокированы и не можете отправлять сообщения.</div>:(
            <div className="relative pn border-t bl p-2.5 flex items-center gap-2">
              {emo&&<div className="absolute bottom-full left-2 mb-2 pn rounded-2xl shadow-lg border bl p-2 grid grid-cols-8 gap-1 w-72 max-h-48 overflow-y-auto">
                {EMOJIS.map(e=><button key={e} onClick={()=>setText(t=>t+e)} className="text-xl hv rounded-lg p-1">{e}</button>)}</div>}
              <button onClick={()=>setEmo(!emo)} className="mu p-1.5 hover:bg-[var(--hover)] rounded-lg"><Smile size={24}/></button>
              <input className="inp" placeholder="Написать сообщение…" value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()} maxLength={2000}/>
              <button onClick={send} disabled={!text.trim()} className="acb disabled:opacity-40 w-10 h-10 rounded-md grid place-items-center shrink-0 transition-opacity"><Send size={18}/></button>
            </div>)}
        </>)}
      </main>

      {profU&&<Profile u={profU} me={me} now={now} onClose={()=>setProf(null)} onChat={openChat} onGift={id=>{setProf(null);setGiftTo(id)}}/>}
      {giftU&&<GiftPicker to={giftU} me={me} free={false} onSent={g=>setAnim(g)} onClose={()=>setGiftTo(null)}/>}
      {anim&&<GiftAnim giftData={anim} onDone={()=>setAnim(null)}/>}
    </div>);
}

function App(){
  const [prefs,setPrefs]=useState(loadPrefs);
  const [au,setAu]=useState(undefined),[users,setUsers]=useState(null),[err,setErr]=useState("");
  const save=p=>{setPrefs(p);try{localStorage.setItem(PK,JSON.stringify(p))}catch{}};
  useEffect(()=>onAuthStateChanged(auth,setAu),[]);
  useEffect(()=>{
    if(!au){setUsers(null);return}
    return onSnapshot(collection(db,"users"),s=>setUsers(s.docs.map(fixU)),e=>setErr(e.message));
  },[au?.uid]);
  const me=au&&users&&users.find(u=>u.uid===au.uid);
  const logout=()=>signOut(auth);
  const wrap=c=><div style={cssVars(prefs)} className="tx bgm min-h-screen">{c}</div>;
  if(err)return wrap(<div className="p-6 text-red-500">Ошибка базы данных: {err}<br/>Проверьте firebaseConfig и правила Firestore.</div>);
  if(au===undefined||(au&&!users))return wrap(<div className="p-6 mu">Подключение к BunkMess…</div>);
  if(!au)return wrap(<Login/>);
  if(!me)return wrap(<Onboard au={au} users={users} logout={logout}/>);
  return wrap(<Messenger me={me} users={users} logout={logout} prefs={prefs} save={save}/>);
}

createRoot(document.getElementById("root")).render(configured?<App/>:<Setup/>);
</script>
</body>
</html>
